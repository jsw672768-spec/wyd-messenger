name: Web and database verification
on:
  pull_request:
    paths: ['my-app/**', 'supabase/**', '.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: my-app
      - name: Typecheck, lint, tests, production build and HTTP smoke
        working-directory: my-app
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          node tests/smoke.mjs
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: wyd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging schema and server-enforced permissions
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: wyd_test
          PGPASSWORD: ci-only-disposable-password
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609090001_verified_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/permissions.sql | tee database-test-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WYD-database-test-results
          path: database-test-results.txt
          retention-days: 30
