name: Android APK
on:
  push:
    branches: [main, feat/android-app-20260907]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional deployed HTTPS WYD web app URL'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        working-directory: android-app
        env:
          WYD_SITE_URL: ${{ inputs.site_url || vars.WYD_SITE_URL || '' }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WYD-Messenger-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
