name: Android verification
on:
  pull_request:
    paths: ['android-app/**', '.github/workflows/android-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and run unit tests
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Retrieve both original APKs for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/original evidence/previous-verification evidence/current evidence/tools
          gh run download 34119222754 --repo jsw672768-spec/wyd-messenger --name WYD-Messenger-Android-debug --dir evidence/original
          gh run download 34119266220 --repo jsw672768-spec/wyd-messenger --name WYD-Messenger-Android-debug --dir evidence/previous-verification
          cp android-app/app/build/outputs/apk/debug/app-debug.apk evidence/current/WYD-Messenger-debug.apk
      - name: Verify manifest, integrity, signature and alignment
        run: |
          bash android-app/scripts/verify-apk.sh evidence/original/app-debug.apk evidence/original
          bash android-app/scripts/verify-apk.sh evidence/previous-verification/app-debug.apk evidence/previous-verification
          bash android-app/scripts/verify-apk.sh evidence/current/WYD-Messenger-debug.apk evidence/current
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" evidence/tools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WYD-APK-forensic-evidence
          path: |
            evidence/
            android-app/app/build/reports/
          if-no-files-found: error
          retention-days: 30
  install:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WYD-APK-forensic-evidence
          path: downloaded
      - name: Enable KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install originals, reproduce signature conflict, and launch current build
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash android-app/scripts/install-smoke.sh downloaded/evidence evidence-device
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WYD-install-API-${{ matrix.api }}
          path: evidence-device/
          if-no-files-found: error
          retention-days: 30
